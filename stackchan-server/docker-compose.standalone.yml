services:
  stackchan:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/standalone.sh"]
    restart: unless-stopped
    environment:
      STACKCHAN_DATA_DIR: /data
      STACKCHAN_LOCAL_HOST: ${STACKCHAN_LOCAL_HOST:?Set STACKCHAN_LOCAL_HOST in .env}
      STACKCHAN_SETTINGS_TOKEN: ${STACKCHAN_SETTINGS_TOKEN:-}
      STACKCHAN_AI_PROVIDER: ${STACKCHAN_AI_PROVIDER:-openai}
      STACKCHAN_OPENAI_API_KEY: ${STACKCHAN_OPENAI_API_KEY:-}
      STACKCHAN_OPENAI_REALTIME_MODEL: ${STACKCHAN_OPENAI_REALTIME_MODEL:-gpt-realtime}
      STACKCHAN_OPENAI_TTS_VOICE: ${STACKCHAN_OPENAI_TTS_VOICE:-alloy}
      STACKCHAN_GEMINI_API_KEY: ${STACKCHAN_GEMINI_API_KEY:-}
      STACKCHAN_GEMINI_MODEL: ${STACKCHAN_GEMINI_MODEL:-gemini-2.5-flash-native-audio-latest}
      STACKCHAN_GEMINI_VOICE: ${STACKCHAN_GEMINI_VOICE:-Aoede}
      STACKCHAN_GEMINI_ENABLE_TOOLS: ${STACKCHAN_GEMINI_ENABLE_TOOLS:-true}
      STACKCHAN_GEMINI_ENABLE_SEARCH: ${STACKCHAN_GEMINI_ENABLE_SEARCH:-false}
      STACKCHAN_COMPATIBLE_BASE_URL: ${STACKCHAN_COMPATIBLE_BASE_URL:-}
      STACKCHAN_COMPATIBLE_API_KEY: ${STACKCHAN_COMPATIBLE_API_KEY:-}
      STACKCHAN_COMPATIBLE_MODEL: ${STACKCHAN_COMPATIBLE_MODEL:-}
      STACKCHAN_COMPATIBLE_STT_MODEL: ${STACKCHAN_COMPATIBLE_STT_MODEL:-whisper-1}
      STACKCHAN_COMPATIBLE_TTS_MODEL: ${STACKCHAN_COMPATIBLE_TTS_MODEL:-tts-1}
      STACKCHAN_COMPATIBLE_TTS_VOICE: ${STACKCHAN_COMPATIBLE_TTS_VOICE:-alloy}
      STACKCHAN_TOKENHUB_BASE_URL: ${STACKCHAN_TOKENHUB_BASE_URL:-}
      STACKCHAN_TOKENHUB_API_KEY: ${STACKCHAN_TOKENHUB_API_KEY:-}
      STACKCHAN_OPENROUTER_API_KEY: ${STACKCHAN_OPENROUTER_API_KEY:-}
      STACKCHAN_STT_BASE_URL: ${STACKCHAN_STT_BASE_URL:-}
      STACKCHAN_STT_API_KEY: ${STACKCHAN_STT_API_KEY:-}
      STACKCHAN_STT_MODEL: ${STACKCHAN_STT_MODEL:-}
      STACKCHAN_LLM_BASE_URL: ${STACKCHAN_LLM_BASE_URL:-}
      STACKCHAN_LLM_API_KEY: ${STACKCHAN_LLM_API_KEY:-}
      STACKCHAN_LLM_MODEL: ${STACKCHAN_LLM_MODEL:-}
      STACKCHAN_TTS_BASE_URL: ${STACKCHAN_TTS_BASE_URL:-}
      STACKCHAN_TTS_API_KEY: ${STACKCHAN_TTS_API_KEY:-}
      STACKCHAN_TTS_MODEL: ${STACKCHAN_TTS_MODEL:-}
      STACKCHAN_TTS_VOICE: ${STACKCHAN_TTS_VOICE:-}
      STACKCHAN_AUDIO_PREBUFFER_MS: ${STACKCHAN_AUDIO_PREBUFFER_MS:-300}
      STACKCHAN_AUDIO_PREBUFFER_MAX_WAIT_MS: ${STACKCHAN_AUDIO_PREBUFFER_MAX_WAIT_MS:-900}
      STACKCHAN_BACKGROUND_TASKS_ENABLED: ${STACKCHAN_BACKGROUND_TASKS_ENABLED:-false}
      STACKCHAN_BACKGROUND_AGENT_BASE_URL: ${STACKCHAN_BACKGROUND_AGENT_BASE_URL:-https://api.openai.com}
      STACKCHAN_BACKGROUND_AGENT_API_KEY: ${STACKCHAN_BACKGROUND_AGENT_API_KEY:-}
      STACKCHAN_BACKGROUND_AGENT_MODEL: ${STACKCHAN_BACKGROUND_AGENT_MODEL:-}
      STACKCHAN_BACKGROUND_AGENT_TIMEOUT_SECONDS: ${STACKCHAN_BACKGROUND_AGENT_TIMEOUT_SECONDS:-300}
      STACKCHAN_DEVICE_PROFILES: ${STACKCHAN_DEVICE_PROFILES:-}
      STACKCHAN_SYSTEM_PROMPT: ${STACKCHAN_SYSTEM_PROMPT:-You are StackChan, a friendly desktop robot assistant. Keep replies concise.}
    ports:
      - "${STACKCHAN_WS_PORT:-12800}:12800"
      - "127.0.0.1:${STACKCHAN_SETTINGS_PORT:-8099}:8099"
    volumes:
      - "${STACKCHAN_DATA_DIR:-./data}:/data"
