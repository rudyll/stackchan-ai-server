name: "StackChan AI Server"
description: "StackChan AI server: realtime or OpenAI-compatible voice pipeline + Home Assistant device control"
version: "2.8.0-beta.2"
slug: "stackchan_ai_server"
init: false
ingress: true
ingress_port: 8099

arch:
  - aarch64
  - amd64
  - armv7
  - armhf

ports:
  12800/tcp: 12800
  443/tcp: 443
ports_description:
  12800/tcp: "StackChan WebSocket server"
  443/tcp: "OTA HTTPS intercept (api.tenclass.net DNS override)"

# User fills these in the add-on UI instead of editing config.yaml manually.
options:
  local_host: "192.168.1.100"
  ha_enabled: true
  ha_mcp_token: ""
  ai_provider: "openai"
  openai_api_key: ""
  openai_realtime_model: "gpt-realtime"
  openai_tts_voice: "alloy"
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash-native-audio-latest"
  gemini_voice: "Aoede"
  gemini_enable_tools: true
  gemini_enable_search: false
  compatible_base_url: ""
  compatible_api_key: ""
  compatible_model: ""
  compatible_stt_model: "whisper-1"
  compatible_tts_model: "tts-1"
  compatible_tts_voice: "alloy"
  tokenhub_base_url: ""
  tokenhub_api_key: ""
  openrouter_api_key: ""
  stt_base_url: ""
  stt_api_key: ""
  stt_model: ""
  llm_base_url: ""
  llm_api_key: ""
  llm_model: ""
  tts_base_url: ""
  tts_api_key: ""
  tts_model: ""
  tts_voice: ""
  audio_prebuffer_ms: 300
  audio_prebuffer_max_wait_ms: 900
  background_tasks_enabled: false
  background_agent_base_url: "https://api.openai.com"
  background_agent_api_key: ""
  background_agent_model: ""
  background_agent_timeout_seconds: 300
  device_profiles: "{}"
  system_prompt: "你是 StackChan，一个桌面 AI 助手机器人，可以控制 Home Assistant 智能家居设备、回答问题、闲聊。\n\n重要：始终用中文回复，语音简洁自然，不要解释你的推理过程或执行步骤。\n\n智能家居控制规则：\n- 指令明确 → 直接调用工具执行，只用一句话报告结果（如「好的，已关灯」）\n- 指令模糊（如「好热」）→ 只问一个最关键的问题，根据回答执行\n- 搜索到多个匹配设备 → 简短列出名称，问控制哪一个还是全部\n- 不要问「你确定吗」之类多余确认\n- 搜索设备优先按名称精确匹配，其次按区域匹配"

schema:
  local_host: str
  ha_enabled: bool
  ha_mcp_token: str
  ai_provider: list(openai|gemini|tokenhub|openrouter|openai_compatible)
  openai_api_key: str?
  openai_realtime_model: str
  openai_tts_voice: list(alloy|ash|ballad|coral|echo|sage|shimmer|verse|marin|cedar)
  gemini_api_key: str?
  gemini_model: str
  gemini_voice: list(Aoede|Charon|Fenrir|Kore|Puck|Leda|Orus|Zephyr|Achernar|Achird|Algenib|Algieba|Alnilam|Autonoe|Callirrhoe|Despina|Enceladus|Erinome|Gacrux|Iapetus|Laomedeia|Pulcherrima|Rasalgethi|Sadachbia|Sadaltager|Schedar|Sulafat|Umbriel|Vindemiatrix|Zubenelgenubi)
  gemini_enable_tools: bool
  gemini_enable_search: bool
  compatible_base_url: str?
  compatible_api_key: str?
  compatible_model: str?
  compatible_stt_model: str?
  compatible_tts_model: str?
  compatible_tts_voice: str?
  tokenhub_base_url: str?
  tokenhub_api_key: str?
  openrouter_api_key: str?
  stt_base_url: str?
  stt_api_key: str?
  stt_model: str?
  llm_base_url: str?
  llm_api_key: str?
  llm_model: str?
  tts_base_url: str?
  tts_api_key: str?
  tts_model: str?
  tts_voice: str?
  audio_prebuffer_ms: list(0|120|180|240|300|360|480|600)
  audio_prebuffer_max_wait_ms: list(300|500|700|900|1200|1500)
  background_tasks_enabled: bool
  background_agent_base_url: str?
  background_agent_api_key: str?
  background_agent_model: str?
  background_agent_timeout_seconds: int(10,1800)
  device_profiles: str?
  system_prompt: str

# Allow outbound internet access (needed for OpenAI API).
host_network: false
