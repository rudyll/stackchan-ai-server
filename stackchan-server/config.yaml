name: "StackChan AI Server"
description: "StackChan AI server: OpenAI (Whisper + GPT + TTS) + Home Assistant device control"
version: "2.0.4"
slug: "stackchan_ai_server"
init: false

arch:
  - aarch64
  - amd64
  - armv7
  - armhf

ports:
  12800/tcp: 12800
  443/tcp: 443
ports_description:
  12800/tcp: "StackChan WebSocket server"
  443/tcp: "OTA HTTPS intercept (api.tenclass.net DNS override)"

# User fills these in the add-on UI instead of editing config.yaml manually.
options:
  local_host: "10.20.20.8"
  ha_mcp_token: ""
  openai_api_key: ""
  openai_model: "gpt-4o-mini"
  openai_tts_voice: "alloy"
  system_prompt: "You are StackChan, a friendly desktop robot assistant. Keep replies concise."

schema:
  local_host: str
  ha_mcp_token: str
  openai_api_key: str
  openai_model: str
  openai_tts_voice: str
  system_prompt: str

# Allow outbound internet access (needed for OpenAI API).
host_network: false
