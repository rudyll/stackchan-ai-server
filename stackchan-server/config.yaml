name: "StackChan AI Server"
description: "StackChan AI server: OTA proxy (firmware update prevention) + Xiaozhi MCP bridge for Home Assistant control"
version: "1.1.0"
slug: "stackchan_ai_server"
init: false

arch:
  - aarch64
  - amd64
  - armv7
  - armhf

ports:
  12800/tcp: 12800
ports_description:
  12800/tcp: "StackChan OTA proxy"

# User fills these in the add-on UI instead of editing config.yaml manually.
options:
  ha_mcp_token: ""
  xiaozhi_mcp_url: ""
  upstream_ota_url: "https://api.tenclass.net/xiaozhi/ota/"

schema:
  ha_mcp_token: str
  xiaozhi_mcp_url: str
  upstream_ota_url: str

# Allow outbound internet access (needed for Xiaozhi MCP relay).
host_network: false
