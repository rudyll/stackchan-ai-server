name: "StackChan AI Server"
description: "StackChan AI server: OpenAI Realtime / Gemini Live + Home Assistant device control"
version: "2.3.15"
slug: "stackchan_ai_server"
init: false

arch:
  - aarch64
  - amd64
  - armv7
  - armhf

ports:
  12800/tcp: 12800
  443/tcp: 443
ports_description:
  12800/tcp: "StackChan WebSocket server"
  443/tcp: "OTA HTTPS intercept (api.tenclass.net DNS override)"

# User fills these in the add-on UI instead of editing config.yaml manually.
options:
  local_host: "192.168.1.100"
  ha_mcp_token: ""
  ai_provider: "openai"
  openai_api_key: ""
  openai_realtime_model: "gpt-realtime-1.5"
  openai_tts_voice: "alloy"
  gemini_api_key: ""
  gemini_model: "gemini-2.5-flash-native-audio-latest"
  gemini_voice: "Aoede"
  gemini_enable_tools: true
  gemini_enable_search: false
  system_prompt: "你是 StackChan，一个桌面 AI 助手机器人，可以控制 Home Assistant 智能家居设备、回答问题、闲聊，以及联网查询实时信息。\n\n智能家居控制规则：\n- 指令明确（如「关客厅灯」、「把客厅空调设为26度」）→ 直接执行，简短报告结果\n- 指令模糊（如「好热」、「太暗了」）→ 只问一个最关键的问题（在哪个房间？要开空调吗？），根据回答执行\n- 发现多个匹配设备 → 说出设备名称，询问控制哪一个还是全部\n- 不要问多余的确认（不要问「你确定吗」）\n\n搜索设备时优先按实体名称精确匹配，其次按区域匹配。对话保持连贯，可以基于前文理解用户意图。用中文回复，语音简洁自然。"

schema:
  local_host: str
  ha_mcp_token: str
  ai_provider: list(openai|gemini)
  openai_api_key: str?
  openai_realtime_model: list(gpt-realtime-1.5|gpt-realtime-mini|gpt-4o-realtime-preview|gpt-4o-mini-realtime-preview)
  openai_tts_voice: list(alloy|echo|fable|onyx|nova|shimmer|ash|coral|sage|verse|cedar|marin|cove)
  gemini_api_key: str?
  gemini_model: list(gemini-2.5-flash-native-audio-latest|gemini-2.5-flash-native-audio-preview-09-2025|gemini-2.5-flash-native-audio-preview-12-2025|gemini-3.1-flash-live-preview)
  gemini_voice: list(Aoede|Charon|Fenrir|Kore|Puck|Leda|Orus|Zephyr|Achernar|Achird|Algenib|Algieba|Alnilam|Autonoe|Callirrhoe|Despina|Enceladus|Erinome|Gacrux|Iapetus|Laomedeia|Pulcherrima|Rasalgethi|Sadachbia|Sadaltager|Schedar|Sulafat|Umbriel|Vindemiatrix|Zubenelgenubi)
  gemini_enable_tools: bool
  gemini_enable_search: bool
  system_prompt: str

# Allow outbound internet access (needed for OpenAI API).
host_network: false
